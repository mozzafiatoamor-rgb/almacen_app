name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy icons to public
        run: |
          mkdir -p public
          # Copy PWA icons if they exist in repo root
          for icon in icon-192.png icon-512.png icon-maskable.png favicon.ico logo.png; do
            if [ -f "$icon" ]; then
              cp "$icon" "public/$icon"
              echo "✓ $icon copiado a public/"
            else
              echo "⚠ $icon no encontrado en raíz"
            fi
          done

      - name: Build
        run: npm run build
        env:
          # Set this to /your-repo-name/ (with slashes) in repo Settings > Secrets
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || '/' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
