name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy logo to public
        run: |
          if [ -f logo.png ]; then
            cp logo.png public/logo.png
            echo "logo.png copiado a public/"
          else
            echo "logo.png no encontrado en raíz, usando el existente en public/"
          fi

      - name: Build
        run: npm run build
        env:
          # Set this to /your-repo-name/ (with slashes) in repo Settings > Secrets
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || '/' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
