<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Almac&#233;n Mozzafiato</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1726;--surface:#162030;--surface2:#1e2d42;--surface3:#2a3d56;--accent:#3b82f6;--accent2:#60a5fa;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#3b82f6;--cyan:#22d3ee;--orange:#fb923c;--text:#e0eaf4;--text2:#7a94b0;--radius:14px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;background:var(--green);color:#fff;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s}.toast.show{opacity:1}.toast.error{background:var(--red)}
.setup-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px}
.setup-logo{width:80px;height:80px;border-radius:20px;margin-bottom:20px;object-fit:contain}
.setup-title{font-size:22px;font-weight:700;margin-bottom:8px}.setup-desc{font-size:13px;color:var(--text2);margin-bottom:24px;text-align:center}
.setup-input{width:100%;max-width:360px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--surface3);background:var(--surface);color:var(--text);font-size:14px;margin-bottom:12px;font-family:'DM Sans'}
.login-input{width:100%;max-width:360px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--surface3);background:var(--surface);color:var(--text);font-size:14px;margin-bottom:12px;font-family:'DM Sans'}
.btn{padding:12px 20px;border-radius:var(--radius);border:none;font-size:14px;font-weight:600;cursor:pointer;width:100%;font-family:'DM Sans';transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:var(--surface2);color:var(--text)}.btn-success{background:var(--green);color:#0e1726}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;border-radius:10px}.btn:disabled{opacity:.4}
.status-bar{position:sticky;top:0;z-index:50;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.04)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.status-dot.connected{background:var(--green)}
.status-left{display:flex;align-items:center;gap:10px}.status-right{display:flex;align-items:center;gap:8px}
.app-logo{height:36px;width:auto;border-radius:8px;object-fit:contain}
.user-badge{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface2);border:none;color:var(--text);cursor:pointer;font-family:'DM Sans';font-size:12px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.config-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:4px}
.main-content{padding:16px;padding-bottom:90px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid rgba(255,255,255,.06);display:flex;height:70px;padding-bottom:env(safe-area-inset-bottom);z-index:100;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-item{flex:0 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--text2);font-size:9px;font-weight:500;cursor:pointer;position:relative;font-family:'DM Sans',sans-serif;padding:0 4px}
.nav-item.active{color:var(--accent)}.nav-item.active::before{content:'';position:absolute;top:0;width:32px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.nav-icon{font-size:20px;line-height:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--surface3);margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:14px}.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:14px;font-family:'DM Sans'}
.form-textarea{min-height:60px;resize:vertical}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
.card-title{font-size:16px;font-weight:700}.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--surface);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid rgba(255,255,255,.04)}
.stat-number{font-family:'Space Mono';font-size:28px;font-weight:700;color:var(--accent)}.stat-label{font-size:11px;color:var(--text2);margin-top:4px}
.stat-box.green .stat-number{color:var(--green)}.stat-box.red .stat-number{color:var(--red)}.stat-box.orange .stat-number{color:var(--orange)}.stat-box.blue .stat-number{color:var(--blue)}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--radius);padding:0 14px;margin-bottom:12px}
.search-bar input{flex:1;background:none;border:none;color:var(--text);font-size:14px;padding:12px 0;font-family:'DM Sans';outline:none}
.tab-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.tab-pill{padding:7px 14px;border-radius:20px;border:1px solid var(--surface3);background:var(--surface);color:var(--text2);font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;font-family:'DM Sans'}
.tab-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.record-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.record-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.record-product{font-size:14px;font-weight:600}.record-qty{font-family:'Space Mono';font-weight:700;font-size:16px;color:var(--accent)}
.record-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text2)}
.inv-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:12px;position:relative}
.inv-name{font-size:14px;font-weight:600}.inv-cat{font-size:11px;color:var(--text2);margin-top:2px}
.inv-stock{font-family:'Space Mono';font-size:20px;font-weight:700;text-align:right}.inv-min{font-size:10px;color:var(--text2);text-align:right}
.inv-stock.ok{color:var(--green)}.inv-stock.warn{color:var(--yellow)}.inv-stock.low{color:var(--red)}
.badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600}
.badge.good{background:rgba(52,211,153,.15);color:var(--green)}.badge.warning{background:rgba(251,191,36,.15);color:var(--yellow)}.badge.critical{background:rgba(248,113,113,.15);color:var(--red)}.badge.info{background:rgba(59,130,246,.15);color:var(--blue)}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:var(--radius);background:var(--surface);border:1px solid rgba(255,255,255,.04);cursor:pointer;color:var(--text);font-family:'DM Sans'}
.quick-icon{font-size:24px}.quick-label{font-size:11px;font-weight:500}
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}.empty-icon{font-size:40px;margin-bottom:10px}
.cart-header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--surface3)}.ch-title{font-size:14px;font-weight:600}.ch-count{font-size:12px;color:var(--text2)}
.cart-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.ci-info{flex:1}.ci-name{font-size:13px;font-weight:600}.ci-meta{font-size:11px;color:var(--text2)}
.ci-qty{font-family:'Space Mono';font-weight:700;color:var(--accent)}.ci-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px}
.cart-divider{height:1px;background:var(--surface3);margin:14px 0}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:10px;margin-top:10px}.ct-label{font-size:13px;color:var(--text2)}.ct-amount{font-family:'Space Mono';font-weight:700;font-size:18px;color:var(--green)}
.autocomplete-wrap{position:relative}.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--surface);border-radius:0 0 var(--radius) var(--radius);max-height:200px;overflow-y:auto;z-index:10;display:none;border:1px solid var(--surface3);border-top:none}
.autocomplete-list.open{display:block}.autocomplete-item{padding:10px 14px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center}.autocomplete-item:hover{background:var(--surface2)}
.ac-match{color:var(--accent);font-weight:600}.ac-cat{font-size:10px;color:var(--text2);background:var(--surface3);padding:2px 6px;border-radius:4px}
.ac-selected{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface2);border-radius:var(--radius);font-size:14px}.ac-clear{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;margin-left:auto}
.del-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:8px;opacity:.5}
.uib{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:14px;background:var(--surface);border-radius:var(--radius)}.uib-av{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}.uib-name{font-size:15px;font-weight:600}.uib-role{font-size:11px;color:var(--text2)}
.report-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app"></div>
<script>
const LOGO='logo.png';
let SCRIPT_URL=localStorage.getItem('scriptUrl_almacen')||'';
const S={screen:'setup',setupStep:1,tab:'home',sheetId:localStorage.getItem('sheetId_almacen')||'',apiKey:localStorage.getItem('apiKey_almacen')||'',connected:false,currentUser:null,usuarios:[],catalogo:[],movimientos:[],mermas:[],bitacora:[],inventario:[],stockBajo:[],loading:false,searchQuery:'',filterDate:'',viewMode:'resumen',catFilter:'todos'};

let _acSelected={},modalType=null,_cartMov=[],_cartMerma=[];

const Sheets={
  async read(sh,rg){const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+S.sheetId+'/values/'+encodeURIComponent(sh)+'!'+rg+'?key='+S.apiKey);if(!r.ok)throw new Error(r.status);const d=await r.json();return d.values||[]},
  async append(sh,v){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'append',sheet:sh,values:v})});const d=await r.json();if(!d.success)throw new Error(d.error);return d},
  async deleteRow(sh,rowNum){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'delete',sheet:sh,row:rowNum})});const d=await r.json();if(!d.success)throw new Error(d.error);return d},
  async loadUsers(){try{const rows=await this.read('\u{1F464} Usuarios','A2:E50');S.usuarios=rows.map(r=>({id:r[0]||'',usuario:r[1]||'',password:r[2]||'',nombre:r[3]||'',rol:(r[4]||'almacenista').toLowerCase()})).filter(u=>u.usuario);return true}catch(e){return false}},
  async loadAll(){S.loading=true;render();try{
    const c=await this.read('\u{1F4E6} Cat\u00e1logo','A2:I200');S.catalogo=c.map((r,i)=>({id:r[0]||'',categoria:r[1]||'',producto:r[2]||'',unidad:r[3]||'',stockMinimo:parseInt(r[4])||0,stockActual:parseInt(r[5])||0,activo:(r[6]||'SI').toString().trim().toUpperCase(),proveedor:r[7]||'Sin asignar',pzaPaq:parseInt(r[8])||1,_row:i+2})).filter(p=>p.producto&&p.activo!=='NO');
    const mv=await this.read('\u{1F4E5} Movimientos','A2:J2000');S.movimientos=mv.map((r,i)=>({id:r[0]||'',fecha:normDate(r[1]),hora:r[2]||'',tipo:r[3]||'',categoria:r[4]||'',producto:r[5]||'',cantidad:parseInt(r[6])||0,motivo:r[7]||'',responsable:r[8]||'',notas:r[9]||'',_row:i+2})).filter(p=>p.producto).reverse();
    try{const mr=await this.read('\u26a0\ufe0f Mermas','A2:I1000');S.mermas=mr.map((r,i)=>({id:r[0]||'',fecha:normDate(r[1]),hora:r[2]||'',categoria:r[3]||'',producto:r[4]||'',cantidad:parseInt(r[5])||0,motivo:r[6]||'',responsable:r[7]||'',notas:r[8]||'',_row:i+2})).filter(p=>p.producto).reverse()}catch(e){S.mermas=[]}
    S.inventario=S.catalogo.map(function(p){return{id:p.id,categoria:p.categoria,producto:p.producto,unidad:p.unidad,stockActual:p.stockActual,stockMinimo:p.stockMinimo,proveedor:p.proveedor}});
    S.stockBajo=S.inventario.filter(function(p){return p.stockMinimo>0&&p.stockActual<p.stockMinimo}).map(function(p){return{categoria:p.categoria,producto:p.producto,unidad:p.unidad,stockActual:p.stockActual,stockMinimo:p.stockMinimo,faltante:p.stockMinimo-p.stockActual,proveedor:p.proveedor}});
    S.connected=true}catch(e){console.error(e);toast('Error al cargar',1);S.connected=false}
    try{const bt=await this.read('\u{1F4DC} Bit\u00e1cora','A2:F1000');S.bitacora=bt.map(r=>({fecha:normDate(r[0]),hora:r[1]||'',usuario:r[2]||'',accion:r[3]||'',detalle:r[4]||'',tipo:r[5]||''})).filter(b=>b.accion).reverse().slice(0,300)}catch(e){S.bitacora=[]}
    S.loading=false;render()}
};

function toast(m,e){const t=document.getElementById('toast');t.textContent=(e?'\u26a0\ufe0f ':'\u2705 ')+m;t.className='toast show'+(e?' error':'');setTimeout(()=>t.className='toast',2500)}
function today(){return new Date().toLocaleDateString('es-MX',{year:'numeric',month:'2-digit',day:'2-digit'})}
function now(){const d=new Date();return{date:d.toLocaleDateString('es-MX',{year:'numeric',month:'2-digit',day:'2-digit'}),time:d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}}
function dateToISO(d){if(!d)return'';if(d.includes('-'))return d;const p=d.split('/');if(p.length!==3)return d;return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')}
function isoToDate(d){if(!d)return'';const p=d.split('-');if(p.length!==3)return d;return p[2]+'/'+p[1]+'/'+p[0]}
function normDate(d){if(!d)return'';const s=String(d).trim();if(s.includes('-')){const p=s.split('-');return p[2].padStart(2,'0')+'/'+p[1].padStart(2,'0')+'/'+p[0]}if(s.includes('/')){const p=s.split('/');return p[0].padStart(2,'0')+'/'+p[1].padStart(2,'0')+'/'+p[2]}return s}
function nextId(p,l){const n=l.map(r=>parseInt((r.id||'0').replace(/\D/g,''))||0);return p+String((n.length?Math.max(...n):0)+1).padStart(4,'0')}
function uName(){return S.currentUser?S.currentUser.nombre:''}
function uInit(){return uName()?uName().charAt(0).toUpperCase():'?'}
function isAdmin(){return S.currentUser&&S.currentUser.rol==='admin'}
function canManage(){return S.currentUser&&(S.currentUser.rol==='admin'||S.currentUser.rol==='encargado')}
function getCats(){var c=[...new Set(S.catalogo.map(p=>p.categoria))];return c.sort()}
function getProvs(){var p=[...new Set(S.catalogo.map(x=>x.proveedor))];return p.sort()}
async function logAction(a,d,t){var n=now();var safe=String(d).replace(/^\+/,'');try{await Sheets.append('\u{1F4DC} Bit\u00e1cora',[n.date,n.time,uName(),a,safe,t])}catch(e){}}

function render(){const a=document.getElementById('app');if(S.screen==='setup')a.innerHTML=renderSetup();else if(S.screen==='login')a.innerHTML=renderLogin();else a.innerHTML=renderMain()}

function renderSetup(){
if(S.setupStep===1)return'<div class="setup-screen"><img src="'+LOGO+'" class="setup-logo" onerror="this.style.display=\'none\'"><div class="setup-title">Almac\u00e9n Mozzafiato</div><div class="setup-desc">Paso 1/3: Google Sheet ID</div><input class="setup-input" id="sI" placeholder="Sheet ID..." value="'+S.sheetId+'" oninput="document.getElementById(\'btnN1\').disabled=!this.value.trim()" onpaste="setTimeout(()=>{document.getElementById(\'btnN1\').disabled=!document.getElementById(\'sI\').value.trim()},50)"><button class="btn btn-primary" id="btnN1" onclick="S.sheetId=document.getElementById(\'sI\').value.trim();S.setupStep=2;render()" '+(S.sheetId?'':'disabled')+'>Siguiente</button></div>';
if(S.setupStep===2)return'<div class="setup-screen"><img src="'+LOGO+'" class="setup-logo" onerror="this.style.display=\'none\'"><div class="setup-title">Almac\u00e9n Mozzafiato</div><div class="setup-desc">Paso 2/3: API Key</div><input class="setup-input" id="sK" placeholder="API Key..." value="'+S.apiKey+'" oninput="document.getElementById(\'btnN2\').disabled=!this.value.trim()" onpaste="setTimeout(()=>{document.getElementById(\'btnN2\').disabled=!document.getElementById(\'sK\').value.trim()},50)"><button class="btn btn-primary" id="btnN2" onclick="S.apiKey=document.getElementById(\'sK\').value.trim();S.setupStep=3;render()" '+(S.apiKey?'':'disabled')+'>Siguiente</button><button class="btn btn-secondary" style="margin-top:8px" onclick="S.setupStep=1;render()">Atr\u00e1s</button></div>';
return'<div class="setup-screen"><img src="'+LOGO+'" class="setup-logo" onerror="this.style.display=\'none\'"><div class="setup-title">Almac\u00e9n Mozzafiato</div><div class="setup-desc">Paso 3/3: URL del Apps Script</div><input class="setup-input" id="sU" placeholder="https://script.google.com/..." value="'+SCRIPT_URL+'" oninput="document.getElementById(\'btnC\').disabled=!this.value.trim()" onpaste="setTimeout(()=>{document.getElementById(\'btnC\').disabled=!document.getElementById(\'sU\').value.trim()},50)"><button class="btn btn-success" id="btnC" onclick="SCRIPT_URL=document.getElementById(\'sU\').value.trim();localStorage.setItem(\'sheetId_almacen\',S.sheetId);localStorage.setItem(\'apiKey_almacen\',S.apiKey);localStorage.setItem(\'scriptUrl_almacen\',SCRIPT_URL);S.screen=\'login\';Sheets.loadUsers();render()" '+(SCRIPT_URL?'':'disabled')+'>Conectar</button><button class="btn btn-secondary" style="margin-top:8px" onclick="S.setupStep=2;render()">Atr\u00e1s</button></div>';
}

function renderLogin(){return'<div class="setup-screen"><img src="'+LOGO+'" class="setup-logo" onerror="this.style.display=\'none\'"><div class="setup-title">Iniciar Sesi\u00f3n</div><div class="setup-desc">Ingresa tus credenciales</div><input class="login-input" id="lu" placeholder="\u{1F464} Usuario" autocapitalize="off" autocomplete="off"><input class="login-input" id="lp" placeholder="\u{1F512} Contrase\u00f1a" type="password" onkeydown="if(event.key===\'Enter\')doLogin()"><div style="width:100%;max-width:360px"><button class="btn btn-primary" onclick="doLogin()">\u{1F511} Entrar</button></div><div style="margin-top:20px;font-size:11px;color:var(--text2)">Solicita tus credenciales al administrador</div></div>'}

async function doLogin(){const u=document.getElementById('lu').value.trim().toLowerCase(),p=document.getElementById('lp').value;if(!u||!p){toast('Escribe usuario y contrase\u00f1a',1);return}await Sheets.loadUsers();const f=S.usuarios.find(x=>x.usuario.toLowerCase()===u&&x.password===p);if(!f){toast('Usuario o contrase\u00f1a incorrectos',1);return}S.currentUser={id:f.id,usuario:f.usuario,nombre:f.nombre,rol:f.rol};localStorage.setItem('currentUser_almacen',JSON.stringify(S.currentUser));S.screen='main';toast('\u00a1Bienvenido, '+f.nombre+'!');await Sheets.loadAll()}
function logout(){S.currentUser=null;localStorage.removeItem('currentUser_almacen');S.screen='login';S.tab='home';render()}

function renderMain(){const sc=S.connected?'connected':'';let c='';switch(S.tab){case'home':c=renderHome();break;case'movimientos':c=renderMov();break;case'inventario':c=renderInv();break;case'compras':c=renderCompras();break;case'mermas':c=renderMermas();break;case'catalogo':c=renderCat();break;case'bitacora':c=renderBit();break}

function switchTab(t){S.tab=t;S.searchQuery='';S.filterDate='';S.viewMode='resumen';render()}

if(S.tab==='movimientos'){var d=S.movimientos;if(S.filterDate)d=d.filter(function(p){return p.fecha===S.filterDate});if(q)d=d.filter(function(p){return p.producto.toLowerCase().includes(q)||p.tipo.toLowerCase().includes(q)||p.responsable.toLowerCase().includes(q)});l.innerHTML=S.viewMode==='resumen'?renderMovSummary(d):renderMovList(d)}
else if(S.tab==='inventario'){var d=S.inventario;if(q)d=d.filter(function(p){return p.producto.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)});if(S.catFilter!=='todos')d=d.filter(function(p){return p.categoria===S.catFilter});l.innerHTML=renderInvList(d)}
else if(S.tab==='compras'){var items=S.stockBajo;var provFilter=S.catFilter;if(provFilter!=='todos')items=items.filter(function(p){return p.proveedor===provFilter});if(q)items=items.filter(function(p){return p.producto.toLowerCase().includes(q)||p.proveedor.toLowerCase().includes(q)});var byProv={};items.forEach(function(p){var k=p.proveedor||'Sin asignar';if(!byProv[k])byProv[k]=[];byProv[k].push(p)});l.innerHTML=renderComprasList(Object.keys(byProv).sort(),byProv)}
else if(S.tab==='mermas'){var d=S.mermas;if(S.filterDate)d=d.filter(function(p){return p.fecha===S.filterDate});if(q)d=d.filter(function(p){return p.producto.toLowerCase().includes(q)||p.motivo.toLowerCase().includes(q)||p.responsable.toLowerCase().includes(q)});l.innerHTML=renderMermasList(d)}
else if(S.tab==='catalogo'){var d=S.catalogo;if(q)d=d.filter(function(p){return p.producto.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)});if(S.catFilter!=='todos')d=d.filter(function(p){return p.categoria===S.catFilter});l.innerHTML=renderCatList(d)}
else if(S.tab==='bitacora'){var d=S.bitacora;if(S.filterDate)d=d.filter(function(b){return b.fecha===S.filterDate});if(q)d=d.filter(function(b){return b.accion.toLowerCase().includes(q)||b.detalle.toLowerCase().includes(q)||b.usuario.toLowerCase().includes(q)});l.innerHTML=renderBitList(d)}}

// HOME
function renderHome(){var entHoy=S.movimientos.filter(function(m){return m.fecha===today()&&m.tipo==='Entrada'}).reduce(function(s,m){return s+m.cantidad},0);var salHoy=S.movimientos.filter(function(m){return m.fecha===today()&&m.tipo==='Salida'}).reduce(function(s,m){return s+m.cantidad},0);var merHoy=S.mermas.filter(function(m){return m.fecha===today()}).reduce(function(s,m){return s+m.cantidad},0);var bajo=S.stockBajo.length;var rol=S.currentUser?S.currentUser.rol:'';var rolLabel=rol==='admin'?'\u{1F511} Administrador':rol==='encargado'?'\u{1F468}\u200d\u{1F373} Encargado':'\u{1F4E6} Almacenista';
return'<div class="uib"><div class="uib-av">'+uInit()+'</div><div><div class="uib-name">Hola, '+uName()+' \u{1F44B}</div><div class="uib-role">'+rolLabel+'</div></div></div><div class="stats-grid"><div class="stat-box green"><div class="stat-number">'+entHoy+'</div><div class="stat-label">\u{1F4E5} Entradas Hoy</div></div><div class="stat-box orange"><div class="stat-number">'+salHoy+'</div><div class="stat-label">\u{1F4E4} Salidas Hoy</div></div><div class="stat-box red"><div class="stat-number">'+bajo+'</div><div class="stat-label">\u{1F6A8} Stock Bajo</div></div><div class="stat-box blue"><div class="stat-number">'+S.catalogo.length+'</div><div class="stat-label">\u{1F4E6} Productos</div></div>'+(merHoy>0?'<div class="stat-box" style="background:rgba(248,113,113,.1)"><div class="stat-number" style="color:var(--red)">'+merHoy+'</div><div class="stat-label">\u26a0\ufe0f Merma Hoy</div></div>':'')+'</div><div class="quick-actions"><button class="quick-btn" onclick="openModal(\'entrada\')"><span class="quick-icon">\u{1F4E5}</span><span class="quick-label">Entrada</span></button><button class="quick-btn" onclick="openModal(\'salida\')"><span class="quick-icon">\u{1F4E4}</span><span class="quick-label">Salida</span></button><button class="quick-btn" onclick="openModal(\'merma\')"><span class="quick-icon">\u26a0\ufe0f</span><span class="quick-label">Merma</span></button><button class="quick-btn" onclick="switchTab(\'compras\')"><span class="quick-icon">\u{1F6D2}</span><span class="quick-label">Lista Compras</span></button><button class="quick-btn" onclick="Sheets.loadAll()"><span class="quick-icon">\u{1F504}</span><span class="quick-label">Actualizar</span></button></div>'+(bajo>0?'<div class="card"><div class="card-header"><span class="card-title">\u{1F6A8} Stock Bajo</span><span class="badge critical">'+bajo+'</span></div>'+S.stockBajo.slice(0,8).map(function(p){return'<div class="inv-item"><div style="flex:1"><div class="inv-name">'+p.producto+'</div><div class="inv-cat">'+p.categoria+' \u00b7 '+p.unidad+' \u00b7 \u{1F3EA} '+p.proveedor+'</div></div><div><div class="inv-stock low">'+p.stockActual+'</div><div class="inv-min">M\u00edn: '+p.stockMinimo+' (Faltan: '+p.faltante+')</div></div></div>'}).join('')+'</div>':'')+'<div class="card"><div class="card-header"><span class="card-title">\u{1F4E5} \u00daltimos Movimientos</span></div>'+S.movimientos.slice(0,5).map(function(m){var icon=m.tipo==='Entrada'?'\u{1F7E2}':'\u{1F534}';return'<div class="record-item"><div class="record-top"><span class="record-product">'+icon+' '+m.producto+'</span><span class="record-qty" style="color:'+(m.tipo==='Entrada'?'var(--green)':'var(--orange)')+'">'+( m.tipo==='Entrada'?'+':'-')+m.cantidad+'</span></div><div class="record-meta"><span>\u{1F4C5} '+m.fecha+'</span><span>'+m.tipo+'</span><span>\u{1F464} '+m.responsable+'</span></div></div>'}).join('')+'</div>'}

// MOVIMIENTOS
function groupBy(arr,keyFn){var g={};arr.forEach(function(item){var k=keyFn(item);if(!g[k])g[k]={items:[],total:0};g[k].items.push(item);g[k].total+=item.cantidad});return g}
function renderMov(){var d=S.movimientos;if(S.filterDate)d=d.filter(function(p){return p.fecha===S.filterDate});var q=S.searchQuery.toLowerCase();var f=q?d.filter(function(p){return p.producto.toLowerCase().includes(q)||p.tipo.toLowerCase().includes(q)||p.responsable.toLowerCase().includes(q)}):d;
return'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="card-title" style="margin:0">\u{1F4E5} Movimientos</span><div style="display:flex;gap:6px"><button class="btn btn-success btn-sm" onclick="openModal(\'entrada\')">+ Entrada</button><button class="btn btn-sm" style="background:var(--orange);color:#fff" onclick="openModal(\'salida\')">+ Salida</button></div></div><div style="display:flex;gap:8px;margin-bottom:10px"><div class="tab-pills" style="flex:1;margin:0"><button class="tab-pill '+(S.filterDate===''?'active':'')+'" onclick="S.filterDate=\'\';render()">Todos</button><button class="tab-pill '+(S.filterDate===today()?'active':'')+'" onclick="S.filterDate=today();render()">Hoy</button></div><input type="date" class="form-input" style="width:140px;padding:7px 10px;font-size:12px" value="'+(S.filterDate?dateToISO(S.filterDate):'')+'" onchange="S.filterDate=this.value?isoToDate(this.value):\'\';render()"></div><div class="tab-pills" style="margin-bottom:10px"><button class="tab-pill '+(S.viewMode==='resumen'?'active':'')+'" onclick="S.viewMode=\'resumen\';render()">\u{1F4CA} Resumen</button><button class="tab-pill '+(S.viewMode==='detalle'?'active':'')+'" onclick="S.viewMode=\'detalle\';render()">\u{1F4DD} Detalle</button></div><div class="search-bar"><span>\u{1F50D}</span><input placeholder="Buscar..." value="'+S.searchQuery+'" oninput="S.searchQuery=this.value;filterResults()"></div><div id="resultsList">'+(S.viewMode==='resumen'?renderMovSummary(f):renderMovList(f))+'</div>'}
function renderMovSummary(f){var entradas=f.filter(function(m){return m.tipo==='Entrada'});var salidas=f.filter(function(m){return m.tipo==='Salida'});var totalEnt=entradas.reduce(function(s,m){return s+m.cantidad},0);var totalSal=salidas.reduce(function(s,m){return s+m.cantidad},0);var grouped={};f.forEach(function(m){var k=m.producto;if(!grouped[k])grouped[k]={entradas:0,salidas:0,items:[],byUser:{}};if(m.tipo==='Entrada')grouped[k].entradas+=m.cantidad;else grouped[k].salidas+=m.cantidad;grouped[k].items.push(m);var u=m.responsable;if(!grouped[k].byUser[u])grouped[k].byUser[u]={ent:0,sal:0};if(m.tipo==='Entrada')grouped[k].byUser[u].ent+=m.cantidad;else grouped[k].byUser[u].sal+=m.cantidad});var keys=Object.keys(grouped).sort(function(a,b){return(grouped[b].entradas+grouped[b].salidas)-(grouped[a].entradas+grouped[a].salidas)});if(!keys.length)return'<div class="empty-state"><div class="empty-icon">\u{1F4E5}</div><p>Sin movimientos</p></div>';
return'<div style="display:flex;gap:10px;margin-bottom:12px"><div style="flex:1;background:rgba(52,211,153,.1);border-radius:10px;padding:10px;text-align:center"><div style="font-family:Space Mono;font-weight:700;font-size:20px;color:var(--green)">+'+totalEnt+'</div><div style="font-size:11px;color:var(--text2)">Entradas</div></div><div style="flex:1;background:rgba(251,146,60,.1);border-radius:10px;padding:10px;text-align:center"><div style="font-family:Space Mono;font-weight:700;font-size:20px;color:var(--orange)">-'+totalSal+'</div><div style="font-size:11px;color:var(--text2)">Salidas</div></div></div>'+keys.map(function(k){var g=grouped[k];var item=g.items[0];var userList=Object.entries(g.byUser).sort(function(a,b){return(b[1].ent+b[1].sal)-(a[1].ent+a[1].sal)});return'<div class="record-item"><div class="record-top"><span class="record-product">'+k+'</span><div style="display:flex;gap:8px">'+(g.entradas>0?'<span style="font-family:Space Mono;font-weight:700;color:var(--green)">+'+g.entradas+'</span>':'')+(g.salidas>0?'<span style="font-family:Space Mono;font-weight:700;color:var(--orange)">-'+g.salidas+'</span>':'')+'</div></div><div class="record-meta"><span>\u{1F4C1} '+(item.categoria||'')+'</span><span>'+g.items.length+' movimientos</span></div>'+userList.map(function(u){return'<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;margin-top:4px;background:var(--surface2);border-radius:6px;font-size:12px"><span style="color:var(--text2)">\u{1F464} '+u[0]+'</span><div style="display:flex;gap:8px">'+(u[1].ent>0?'<span style="color:var(--green)">+'+u[1].ent+'</span>':'')+(u[1].sal>0?'<span style="color:var(--orange)">-'+u[1].sal+'</span>':'')+'</div></div>'}).join('')+'</div>'}).join('')}
function renderMovList(f){if(!f.length)return'<div class="empty-state"><div class="empty-icon">\u{1F4E5}</div><p>Sin movimientos</p></div>';return f.map(function(m){var icon=m.tipo==='Entrada'?'\u{1F7E2}':'\u{1F534}';var color=m.tipo==='Entrada'?'var(--green)':'var(--orange)';return'<div class="record-item"><div class="record-top"><span class="record-product">'+icon+' '+m.producto+'</span><span class="record-qty" style="color:'+color+'">'+(m.tipo==='Entrada'?'+':'-')+m.cantidad+'</span></div><div class="record-meta"><span>\u{1F4C5} '+m.fecha+'</span><span>\u{1F552} '+m.hora+'</span><span>\u{1F4C1} '+m.categoria+'</span><span>\u{1F464} '+m.responsable+'</span></div>'+(m.motivo?'<div style="font-size:11px;color:var(--text2);margin-top:4px">\u{1F4DD} '+m.motivo+(m.notas?' - '+m.notas:'')+'</div>':'')+'</div>'}).join('')}

// INVENTARIO
function renderInv(){var q=S.searchQuery.toLowerCase();var f=S.inventario;if(q)f=f.filter(function(p){return p.producto.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)});if(S.catFilter!=='todos')f=f.filter(function(p){return p.categoria===S.catFilter});
return'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="card-title" style="margin:0">\u{1F4E6} Inventario ('+S.inventario.length+')</span></div><div class="search-bar"><span>\u{1F50D}</span><input placeholder="Buscar..." value="'+S.searchQuery+'" oninput="S.searchQuery=this.value;filterResults()"></div><div class="tab-pills"><button class="tab-pill '+(S.catFilter==='todos'?'active':'')+'" onclick="S.catFilter=\'todos\';filterResults()">Todos</button>'+getCats().map(function(c){return'<button class="tab-pill '+(S.catFilter===c?'active':'')+'" onclick="S.catFilter=\''+c+'\';filterResults()">'+c+'</button>'}).join('')+'</div><div id="resultsList">'+renderInvList(f)+'</div>'}
function renderInvList(f){if(!f.length)return'<div class="empty-state"><div class="empty-icon">\u{1F4E6}</div><p>Sin productos</p></div>';return f.map(function(p){var pc=p.stockMinimo>0?(p.stockActual/p.stockMinimo):999;var cl=pc<1?'low':pc<1.5?'warn':'ok';var bg=pc<1?'<span class="badge critical">BAJO</span>':pc<1.5?'<span class="badge warning">MEDIO</span>':'<span class="badge good">OK</span>';return'<div class="inv-item"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><div class="inv-name">'+p.producto+'</div>'+bg+'</div><div class="inv-cat">'+p.categoria+' \u00b7 '+p.unidad+' \u00b7 \u{1F3EA} '+p.proveedor+(p.stockMinimo?' \u00b7 M\u00edn: '+p.stockMinimo:'')+'</div></div><div><div class="inv-stock '+cl+'">'+p.stockActual+'</div></div></div>'}).join('')}

// LISTA DE COMPRAS
function renderCompras(){var items=S.stockBajo;var provFilter=S.catFilter;var provs=[...new Set(items.map(function(p){return p.proveedor}))].sort();if(provFilter!=='todos')items=items.filter(function(p){return p.proveedor===provFilter});var q=S.searchQuery.toLowerCase();if(q)items=items.filter(function(p){return p.producto.toLowerCase().includes(q)||p.proveedor.toLowerCase().includes(q)});
var byProv={};items.forEach(function(p){var k=p.proveedor||'Sin asignar';if(!byProv[k])byProv[k]=[];byProv[k].push(p)});var provKeys=Object.keys(byProv).sort();
return'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="card-title" style="margin:0">\u{1F6D2} Lista de Compras</span>'+(items.length>0?'<button class="btn btn-primary btn-sm" onclick="shareListaCompras()">\u{1F4CB} Copiar Lista</button>':'')+'</div>'+(S.stockBajo.length>0?'<div style="background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--accent)">\u{1F6D2} <strong>'+S.stockBajo.length+' productos</strong> necesitan reabastecimiento</div>':'<div style="background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--green)">\u2705 Todo el inventario est\u00e1 completo</div>')+'<div class="tab-pills"><button class="tab-pill '+(S.catFilter==='todos'?'active':'')+'" onclick="S.catFilter=\'todos\';render()">Todos</button>'+provs.map(function(p){return'<button class="tab-pill '+(S.catFilter===p?'active':'')+'" onclick="S.catFilter=\''+p.replace(/'/g,"\\'")+'\';render()">'+p+'</button>'}).join('')+'</div><div class="search-bar"><span>\u{1F50D}</span><input placeholder="Buscar..." value="'+S.searchQuery+'" oninput="S.searchQuery=this.value;filterResults()"></div><div id="resultsList">'+renderComprasList(provKeys,byProv)+'</div>'}
function renderComprasList(provKeys,byProv){if(!provKeys.length)return'<div class="empty-state"><div class="empty-icon">\u2705</div><p>No hay productos por comprar</p></div>';return provKeys.map(function(prov){var items=byProv[prov];var totalItems=items.length;return'<div class="card" style="margin-bottom:12px"><div class="card-header"><span class="card-title" style="font-size:14px">\u{1F3EA} '+prov+'</span><span class="badge info">'+totalItems+' productos</span></div>'+items.map(function(p){return'<div class="inv-item"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><div class="inv-name">'+p.producto+'</div><span class="badge critical">Faltan '+p.faltante+'</span></div><div class="inv-cat">'+p.categoria+' \u00b7 '+p.unidad+' \u00b7 Stock: '+p.stockActual+'/'+p.stockMinimo+'</div></div></div>'}).join('')+'</div>'}).join('')}
function shareListaCompras(){var items=S.stockBajo;var provFilter=S.catFilter;if(provFilter!=='todos')items=items.filter(function(p){return p.proveedor===provFilter});var byProv={};items.forEach(function(p){var k=p.proveedor||'Sin asignar';if(!byProv[k])byProv[k]=[];byProv[k].push(p)});var txt='\u{1F6D2} LISTA DE COMPRAS - '+today()+'\n';txt+='Almac\u00e9n Mozzafiato\n';txt+='━━━━━━━━━━━━━━━━━━━\n\n';Object.keys(byProv).sort().forEach(function(prov){txt+='\u{1F3EA} '+prov.toUpperCase()+'\n';byProv[prov].forEach(function(p){txt+='  \u25ab '+p.producto+' - Comprar: '+p.faltante+' '+p.unidad+' (Stock: '+p.stockActual+'/'+p.stockMinimo+')\n'});txt+='\n'});txt+='Total: '+items.length+' productos';if(navigator.share){navigator.share({title:'Lista de Compras',text:txt}).catch(function(){})}else{navigator.clipboard.writeText(txt).then(function(){toast('Lista copiada al portapapeles')}).catch(function(){toast('Error al copiar',1)})}}

// MERMAS
function renderMermas(){var d=S.mermas;if(S.filterDate)d=d.filter(function(p){return p.fecha===S.filterDate});var q=S.searchQuery.toLowerCase();if(q)d=d.filter(function(p){return p.producto.toLowerCase().includes(q)||p.motivo.toLowerCase().includes(q)||p.responsable.toLowerCase().includes(q)});var merHoy=S.mermas.filter(function(m){return m.fecha===today()}).reduce(function(s,m){return s+m.cantidad},0);
return'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="card-title" style="margin:0">\u26a0\ufe0f Mermas</span><button class="btn btn-primary btn-sm" onclick="openModal(\'merma\')">+ Registrar</button></div>'+(merHoy>0?'<div style="background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--red)">\u26a0\ufe0f Mermas hoy: <strong>'+merHoy+' unidades</strong></div>':'')+'<div style="display:flex;gap:8px;margin-bottom:10px"><div class="tab-pills" style="flex:1;margin:0"><button class="tab-pill '+(S.filterDate===''?'active':'')+'" onclick="S.filterDate=\'\';render()">Todas</button><button class="tab-pill '+(S.filterDate===today()?'active':'')+'" onclick="S.filterDate=today();render()">Hoy</button></div><input type="date" class="form-input" style="width:140px;padding:7px 10px;font-size:12px" value="'+(S.filterDate?dateToISO(S.filterDate):'')+'" onchange="S.filterDate=this.value?isoToDate(this.value):\'\';render()"></div><div class="search-bar"><span>\u{1F50D}</span><input placeholder="Buscar..." value="'+S.searchQuery+'" oninput="S.searchQuery=this.value;filterResults()"></div><div id="resultsList">'+renderMermasList(d)+'</div>'}
function renderMermasList(f){if(!f.length)return'<div class="empty-state"><div class="empty-icon">\u26a0\ufe0f</div><p>Sin mermas</p></div>';return f.map(function(p){return'<div class="record-item" style="border-left:3px solid var(--red);padding-left:12px"><div class="record-top"><span class="record-product">'+p.producto+'</span><span class="record-qty" style="color:var(--red)">-'+p.cantidad+'</span></div><div style="font-size:12px;margin:4px 0;color:var(--yellow)">\u{1F4DD} '+p.motivo+'</div><div class="record-meta"><span>\u{1F4C5} '+p.fecha+'</span><span>\u{1F552} '+p.hora+'</span><span>\u{1F4C1} '+p.categoria+'</span><span>\u{1F464} '+p.responsable+'</span></div></div>'}).join('')}

// CATALOGO
function renderCat(){var q=S.searchQuery.toLowerCase();var f=S.catalogo;if(q)f=f.filter(function(p){return p.producto.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)});if(S.catFilter!=='todos')f=f.filter(function(p){return p.categoria===S.catFilter});
return'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="card-title" style="margin:0">\u{1F4CB} Cat\u00e1logo ('+S.catalogo.length+')</span>'+(canManage()?'<button class="btn btn-primary btn-sm" onclick="openModal(\'addProduct\')">+ Producto</button>':'')+'</div><div class="search-bar"><span>\u{1F50D}</span><input placeholder="Buscar..." value="'+S.searchQuery+'" oninput="S.searchQuery=this.value;filterResults()"></div><div class="tab-pills"><button class="tab-pill '+(S.catFilter==='todos'?'active':'')+'" onclick="S.catFilter=\'todos\';filterResults()">Todos</button>'+getCats().map(function(c){return'<button class="tab-pill '+(S.catFilter===c?'active':'')+'" onclick="S.catFilter=\''+c+'\';filterResults()">'+c+'</button>'}).join('')+'</div><div id="resultsList">'+renderCatList(f)+'</div>'}
function renderCatList(f){if(!f.length)return'<div class="empty-state"><div class="empty-icon">\u{1F4CB}</div><p>Sin productos</p></div>';return f.map(function(p){return'<div class="inv-item" style="cursor:'+(isAdmin()?'pointer':'default')+'" '+(isAdmin()?'onclick="openEditProd(\''+p.id+'\')"':'')+'>'+(isAdmin()?'<button class="del-btn" onclick="event.stopPropagation();confirmDelProd(\''+p.producto.replace(/'/g,"\\'")+'\')">\u{1F5D1}</button>':'')+'<div style="flex:1;padding-right:'+(isAdmin()?'30px':'0')+'"><div class="inv-name">'+p.producto+'</div><div class="inv-cat">'+p.categoria+' \u00b7 '+p.unidad+' \u00b7 \u{1F3EA} '+p.proveedor+' \u00b7 Stock: '+p.stockActual+' \u00b7 M\u00edn: '+p.stockMinimo+'</div></div>'+(isAdmin()?'<span style="color:var(--text2);font-size:16px;margin-right:30px">\u270f\ufe0f</span>':'')+'</div>'}).join('')}

// BITACORA
function renderBit(){var d=S.bitacora;if(S.filterDate)d=d.filter(function(b){return b.fecha===S.filterDate});var q=S.searchQuery.toLowerCase();if(q)d=d.filter(function(b){return b.accion.toLowerCase().includes(q)||b.detalle.toLowerCase().includes(q)||b.usuario.toLowerCase().includes(q)});
return'<div style="margin-bottom:14px"><span class="card-title" style="margin:0">\u{1F4DC} Bit\u00e1cora</span></div><div style="display:flex;gap:8px;margin-bottom:10px"><div class="tab-pills" style="flex:1;margin:0"><button class="tab-pill '+(S.filterDate===''?'active':'')+'" onclick="S.filterDate=\'\';render()">Todas</button><button class="tab-pill '+(S.filterDate===today()?'active':'')+'" onclick="S.filterDate=today();render()">Hoy</button></div><input type="date" class="form-input" style="width:140px;padding:7px 10px;font-size:12px" value="'+(S.filterDate?dateToISO(S.filterDate):'')+'" onchange="S.filterDate=this.value?isoToDate(this.value):\'\';render()"></div><div class="search-bar"><span>\u{1F50D}</span><input placeholder="Buscar usuario, acci\u00f3n..." value="'+S.searchQuery+'" oninput="S.searchQuery=this.value;filterResults()"></div><div id="resultsList">'+renderBitList(d)+'</div>'}
function renderBitList(f){if(!f.length)return'<div class="empty-state"><div class="empty-icon">\u{1F4DC}</div><p>Sin registros</p></div>';return f.map(function(b){return'<div class="record-item"><div style="font-size:13px;font-weight:600">'+b.accion+'</div><div style="font-size:12px;margin:4px 0">'+b.detalle+'</div><div class="record-meta"><span>\u{1F4C5} '+b.fecha+'</span><span>\u{1F552} '+b.hora+'</span><span>\u{1F464} '+b.usuario+'</span><span class="badge info">'+b.tipo+'</span></div></div>'}).join('')}

// MODALS
function openModal(t){modalType=t;render();setTimeout(function(){var m=document.getElementById('modal');if(m)m.scrollTop=0},50)}
function closeModal(){modalType=null;render()}
function showConfirm(t,m,cb){if(confirm(m))cb()}

function renderModal(){if(!modalType)return'';var c='';if(modalType==='entrada')c=fmMov('Entrada');if(modalType==='salida')c=fmMov('Salida');if(modalType==='merma')c=fmMerma();if(modalType==='addProduct')c=fmAddProd();if(modalType==='editProduct')c=fmEditProd();if(modalType==='settings')c=fmSettings();if(modalType==='userMenu')c=fmUser();return'<div class="modal-overlay active" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-handle"></div>'+c+'</div></div>'}

// AUTOCOMPLETE
function acInputFor(inputId){if(inputId==='fProd')acInput(inputId,S.catalogo,function(p){return p.producto});else acInput(inputId,S.catalogo,function(p){return p.producto})}
function acInput(inputId,list,labelFn){var v=document.getElementById(inputId).value.toLowerCase();var el=document.getElementById(inputId+'List');if(!v){el.className='autocomplete-list';return}var f=list.filter(function(p){return labelFn(p).toLowerCase().includes(v)});if(!f.length){el.innerHTML='<div class="autocomplete-item" style="color:var(--text2)">Sin resultados</div>';el.className='autocomplete-list open';return}el.innerHTML=f.slice(0,15).map(function(p){var lb=labelFn(p);var i=lb.toLowerCase().indexOf(v);var catLabel=p.categoria?'<span class="ac-cat">'+p.categoria+'</span>':'';return'<div class="autocomplete-item" onclick="acPick(\''+inputId+'\',\''+lb.replace(/'/g,"\\'")+'\')">'+'<div>'+lb.substring(0,i)+'<span class="ac-match">'+lb.substring(i,i+v.length)+'</span>'+lb.substring(i+v.length)+'</div>'+catLabel+'</div>'}).join('');el.className='autocomplete-list open'}
function acPick(inputId,val){_acSelected[inputId]=val;var wrap=document.getElementById(inputId+'Wrap');wrap.innerHTML='<div class="ac-selected"><strong>'+val+'</strong><button class="ac-clear" onclick="acClearC(\''+inputId+'\')">\u2716</button></div>';var p=S.catalogo.find(function(x){return x.producto===val});if(p){var si=document.getElementById('stockInfoMov');if(si){var paqInfo=p.pzaPaq>1?' \u00b7 \u{1F4E6} 1 paq = '+p.pzaPaq+' '+p.unidad:'';si.innerHTML='<div style="background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px">\u{1F4E6} Stock: <strong style="color:var(--accent)">'+p.stockActual+'</strong> '+p.unidad+paqInfo+'</div>'}var ci=document.getElementById('conversionInfo');if(ci)ci.innerHTML='';calcConversion()}}
function acClearC(inputId){_acSelected[inputId]='';var wrap=document.getElementById(inputId+'Wrap');wrap.innerHTML='<div class="autocomplete-wrap"><input class="form-input" id="'+inputId+'" placeholder="\u{1F50D} Buscar..." oninput="acInputFor(\''+inputId+'\')" onfocus="acInputFor(\''+inputId+'\')" autocomplete="off"><div class="autocomplete-list" id="'+inputId+'List"></div></div>';var si=document.getElementById('stockInfoMov');if(si)si.innerHTML=''}
function acGetVal(id){return _acSelected[id]||''}

// MOV FORM
function fmMov(tipo){var isEnt=tipo==='Entrada';var color=isEnt?'var(--green)':'var(--orange)';var icon=isEnt?'\u{1F4E5}':'\u{1F4E4}';var motivos=isEnt?'<option value="Compra">Compra</option><option value="Reposici\u00f3n">Reposici\u00f3n</option><option value="Transferencia">Transferencia</option><option value="Ajuste">Ajuste inventario</option><option value="Otro">Otro</option>':'<option value="Uso cocina">Uso cocina</option><option value="Uso barra">Uso barra</option><option value="Uso limpieza">Uso limpieza</option><option value="Transferencia">Transferencia</option><option value="Ajuste">Ajuste inventario</option><option value="Otro">Otro</option>';
return'<div class="modal-title" style="color:'+color+'">'+icon+' '+tipo+' de Almac\u00e9n</div><div style="background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px">\u{1F464} <strong>'+uName()+'</strong></div><div class="form-group"><label class="form-label">Producto</label><div id="fProdWrap"><div class="autocomplete-wrap"><input class="form-input" id="fProd" placeholder="\u{1F50D} Buscar producto..." oninput="acInputFor(\'fProd\')" onfocus="acInputFor(\'fProd\')" autocomplete="off"><div class="autocomplete-list" id="fProdList"></div></div></div></div><div id="stockInfoMov"></div>'+(isEnt?'<div class="form-group"><label class="form-label">Modo de entrada</label><div class="tab-pills" style="margin:0"><button class="tab-pill active" id="btnModoPaq" onclick="setModoEntrada(\'paquetes\')">Paquetes</button><button class="tab-pill" id="btnModoPza" onclick="setModoEntrada(\'piezas\')">Piezas directas</button></div></div><input type="hidden" id="fModoEntrada" value="paquetes">':'')+'<div class="form-group"><label class="form-label" id="lblQty">'+(isEnt?'Cantidad de paquetes':'Cantidad')+'</label><input class="form-input" id="fQty" type="number" inputmode="numeric" placeholder="0" min="1" oninput="calcConversion()"></div><div id="conversionInfo"></div><div class="form-group"><label class="form-label">Motivo</label><select class="form-select" id="fMotivo">'+motivos+'</select></div><div class="form-group"><label class="form-label">Notas (opcional)</label><textarea class="form-textarea" id="fNotas" placeholder="Observaciones..."></textarea></div><input type="hidden" id="fTipo" value="'+tipo+'"><button class="btn btn-secondary" onclick="addToCartMov()">\u2795 Agregar a lista</button><div id="cartMov">'+renderCartMov()+'</div><div class="cart-divider"></div><button class="btn btn-primary" style="background:'+color+'" onclick="submitCartMov()" '+(_cartMov.length===0?'disabled':'')+' id="btnSaveMov">'+icon+' Guardar '+tipo+' ('+_cartMov.length+')</button><div style="height:10px"></div><button class="btn btn-secondary" onclick="_cartMov=[];closeModal()">\u2716 Cerrar</button>'}

function setModoEntrada(modo){var bp=document.getElementById('btnModoPaq');var bz=document.getElementById('btnModoPza');var lbl=document.getElementById('lblQty');var hi=document.getElementById('fModoEntrada');if(!bp||!bz)return;if(modo==='paquetes'){bp.className='tab-pill active';bz.className='tab-pill';lbl.textContent='Cantidad de paquetes';hi.value='paquetes'}else{bp.className='tab-pill';bz.className='tab-pill active';lbl.textContent='Cantidad de piezas';hi.value='piezas'}document.getElementById('fQty').value='';var ci=document.getElementById('conversionInfo');if(ci)ci.innerHTML=''}
function calcConversion(){var tipo=document.getElementById('fTipo')?.value;if(tipo!=='Entrada')return;var modo=document.getElementById('fModoEntrada')?.value||'paquetes';var prod=acGetVal('fProd');var qty=parseInt(document.getElementById('fQty')?.value)||0;var ci=document.getElementById('conversionInfo');if(!ci||!prod||qty<1){if(ci)ci.innerHTML='';return}var p=S.catalogo.find(function(x){return x.producto===prod});if(!p){ci.innerHTML='';return}if(modo==='paquetes'&&p.pzaPaq>1){var total=qty*p.pzaPaq;ci.innerHTML='<div style="background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--green)">\u{1F4E6} '+qty+' paq \u00d7 '+p.pzaPaq+' = <strong>'+total+' '+p.unidad+'</strong> entrar\u00e1n al inventario</div>'}else if(modo==='paquetes'&&p.pzaPaq<=1){ci.innerHTML='<div style="background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--text2)">Este producto no tiene conversi\u00f3n por paquete (1:1)</div>'}else{ci.innerHTML=''}}

function addToCartMov(){var prod=acGetVal('fProd'),qty=document.getElementById('fQty').value,motivo=document.getElementById('fMotivo').value,notas=document.getElementById('fNotas').value,tipo=document.getElementById('fTipo').value;if(!prod||!qty||parseInt(qty)<1){toast('Completa campos',1);return}var p=S.catalogo.find(function(x){return x.producto===prod});var modo=document.getElementById('fModoEntrada')?.value||'piezas';var rawQty=parseInt(qty);var realQty=rawQty;var notaConv='';if(tipo==='Entrada'&&modo==='paquetes'&&p&&p.pzaPaq>1){realQty=rawQty*p.pzaPaq;notaConv=rawQty+' paq x'+p.pzaPaq}if(tipo==='Salida'&&p){var st=p.stockActual;var already=_cartMov.filter(function(c){return c.prod===prod&&c.tipo==='Salida'}).reduce(function(s,c){return s+c.qty},0);if(realQty+already>st){toast('Solo hay '+st+' de '+prod,1);return}}_cartMov.push({cat:p?.categoria||'',prod:prod,qty:realQty,tipo:tipo,motivo:motivo,notas:notas,notaConv:notaConv});toast(prod+(notaConv?' ('+notaConv+' = '+realQty+')':' x'+realQty));acClearC('fProd');document.getElementById('fQty').value='';document.getElementById('fNotas').value='';var ci=document.getElementById('conversionInfo');if(ci)ci.innerHTML='';document.getElementById('cartMov').innerHTML=renderCartMov();var btn=document.getElementById('btnSaveMov');if(btn){btn.disabled=false;btn.innerHTML=(tipo==='Entrada'?'\u{1F4E5}':'\u{1F4E4}')+' Guardar '+tipo+' ('+_cartMov.length+')'}}
function removeCartMov(i){_cartMov.splice(i,1);document.getElementById('cartMov').innerHTML=renderCartMov();var btn=document.getElementById('btnSaveMov');if(btn){btn.disabled=_cartMov.length===0}}
function renderCartMov(){if(!_cartMov.length)return'';var tipo=_cartMov[0]?.tipo||'';return'<div class="cart-header"><span class="ch-title">'+(tipo==='Entrada'?'\u{1F4E5}':'\u{1F4E4}')+' Lista</span><span class="ch-count">'+_cartMov.length+' items</span></div>'+_cartMov.map(function(c,i){var color=c.tipo==='Entrada'?'var(--green)':'var(--orange)';return'<div class="cart-item"><div class="ci-info"><div class="ci-name">'+c.prod+'</div><div class="ci-meta">'+c.motivo+(c.notaConv?' \u00b7 \u{1F4E6} '+c.notaConv:'')+(c.notas?' \u00b7 '+c.notas:'')+'</div></div><span class="ci-qty" style="color:'+color+'">'+(c.tipo==='Entrada'?'+':'-')+c.qty+'</span><button class="ci-del" onclick="removeCartMov('+i+')">\u2716</button></div>'}).join('')}
async function submitCartMov(){if(!_cartMov.length)return;var total=_cartMov.length;var tipo=_cartMov[0].tipo;var detalle=_cartMov.map(function(c){return c.qty+' '+c.prod+' ('+c.tipo+' - '+c.motivo+')'}).join(', ');var n=now();var ok=0;for(var c of _cartMov){var id=nextId('MV',S.movimientos);try{await Sheets.append('\u{1F4E5} Movimientos',[id,n.date,n.time,c.tipo,c.cat,c.prod,c.qty,c.motivo,uName(),c.notas]);ok++}catch(e){toast('Error en '+c.prod,1)}}_cartMov=[];await logAction(tipo+' almac\u00e9n',detalle,tipo.toLowerCase());toast(ok+'/'+total+' '+tipo.toLowerCase()+'s guardadas');closeModal();Sheets.loadAll()}

// MERMA FORM
function fmMerma(){return'<div class="modal-title" style="color:var(--red)">\u26a0\ufe0f Registrar Merma</div><div style="background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--red)">\u{1F464} <strong>'+uName()+'</strong> \u2014 Baja por merma</div><div class="form-group"><label class="form-label">Producto</label><div id="fMPWrap"><div class="autocomplete-wrap"><input class="form-input" id="fMP" placeholder="\u{1F50D} Buscar producto..." oninput="acInputMerma()" onfocus="acInputMerma()" autocomplete="off"><div class="autocomplete-list" id="fMPList"></div></div></div></div><div id="stockInfoMerma"></div><div class="form-group"><label class="form-label">Cantidad</label><input class="form-input" id="fMQ" type="number" inputmode="numeric" placeholder="0" min="1"></div><div class="form-group"><label class="form-label">Motivo</label><select class="form-select" id="fMM"><option value="Caducidad">Caducidad / Vencimiento</option><option value="Da\u00f1o">Da\u00f1o / Maltrato</option><option value="Derrame">Derrame</option><option value="Contaminaci\u00f3n">Contaminaci\u00f3n</option><option value="Rotura">Rotura (plaque)</option><option value="Otro">Otro</option></select></div><div class="form-group"><label class="form-label">Detalle</label><textarea class="form-textarea" id="fMN" placeholder="Describe el motivo..."></textarea></div><button class="btn btn-secondary" onclick="addToCartMerma()">\u2795 Agregar</button><div id="cartMerma">'+renderCartMerma()+'</div><div class="cart-divider"></div><button class="btn btn-primary" style="background:var(--red)" onclick="submitCartMerma()" '+(_cartMerma.length===0?'disabled':'')+' id="btnSaveMerma">\u26a0\ufe0f Registrar Merma ('+_cartMerma.length+')</button><div style="height:10px"></div><button class="btn btn-secondary" onclick="_cartMerma=[];closeModal()">\u2716 Cerrar</button>'}
function acInputMerma(){acInput('fMP',S.catalogo,function(p){return p.producto})}
var _origAcPickMerma=acPick;
function addToCartMerma(){var prod=acGetVal('fMP'),qty=document.getElementById('fMQ').value,motivo=document.getElementById('fMM').value,notas=document.getElementById('fMN').value;if(!prod||!qty||parseInt(qty)<1){toast('Completa campos',1);return}var p=S.catalogo.find(function(x){return x.producto===prod});_cartMerma.push({cat:p?.categoria||'',prod:prod,qty:parseInt(qty),motivo:motivo,notas:notas});toast(prod+' x'+qty);acClearC('fMP');document.getElementById('fMQ').value='';document.getElementById('fMN').value='';document.getElementById('cartMerma').innerHTML=renderCartMerma();var btn=document.getElementById('btnSaveMerma');if(btn){btn.disabled=false;btn.innerHTML='\u26a0\ufe0f Registrar Merma ('+_cartMerma.length+')'}}
function removeCartMerma(i){_cartMerma.splice(i,1);document.getElementById('cartMerma').innerHTML=renderCartMerma();var btn=document.getElementById('btnSaveMerma');if(btn){btn.disabled=_cartMerma.length===0;btn.innerHTML='\u26a0\ufe0f Registrar Merma ('+_cartMerma.length+')'}}
function renderCartMerma(){if(!_cartMerma.length)return'';return'<div class="cart-header"><span class="ch-title" style="color:var(--red)">\u26a0\ufe0f Mermas</span><span class="ch-count">'+_cartMerma.length+'</span></div>'+_cartMerma.map(function(c,i){return'<div class="cart-item" style="border-left:3px solid var(--red)"><div class="ci-info"><div class="ci-name">'+c.prod+'</div><div class="ci-meta">'+c.motivo+(c.notas?' \u00b7 '+c.notas:'')+'</div></div><span class="ci-qty" style="color:var(--red)">-'+c.qty+'</span><button class="ci-del" onclick="removeCartMerma('+i+')">\u2716</button></div>'}).join('')}
async function submitCartMerma(){if(!_cartMerma.length)return;var total=_cartMerma.length;var detalle=_cartMerma.map(function(c){return c.qty+' '+c.prod+' ('+c.motivo+')'}).join(', ');var n=now();var ok=0;for(var c of _cartMerma){var id=nextId('MR',S.mermas);try{await Sheets.append('\u26a0\ufe0f Mermas',[id,n.date,n.time,c.cat,c.prod,c.qty,c.motivo+(c.notas?' - '+c.notas:''),uName(),c.notas||'']);ok++}catch(e){toast('Error',1)}}_cartMerma=[];await logAction('Merma',detalle,'merma');toast(ok+'/'+total+' mermas registradas');closeModal();Sheets.loadAll()}

// ADD/EDIT PRODUCT
function fmAddProd(){if(!canManage())return'<div class="modal-title">\u{1F512} Sin permisos</div><button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>';var cats=getCats();return'<div class="modal-title">\u2795 Nuevo Producto</div><div class="form-group"><label class="form-label">Categor\u00eda</label><select class="form-select" id="fNPC" onchange="var f=document.getElementById(\'newCatField\');if(f)f.style.display=this.value===\'__new__\'?\'block\':\'none\'"><option value="">Seleccionar...</option>'+cats.map(function(c){return'<option value="'+c+'">'+c+'</option>'}).join('')+'<option value="__new__">\uff0b Nueva...</option></select></div><div id="newCatField" style="display:none"><div class="form-group"><label class="form-label">Nueva Categor\u00eda</label><input class="form-input" id="fNCN" placeholder="Nombre"></div></div><div class="form-group"><label class="form-label">Producto</label><input class="form-input" id="fNPN" placeholder="Nombre del producto"></div><div class="form-group"><label class="form-label">Unidad</label><select class="form-select" id="fNPU"><option value="pza">Pieza</option><option value="kg">Kilogramo</option><option value="lt">Litro</option><option value="paq">Paquete</option><option value="caja">Caja</option><option value="bolsa">Bolsa</option><option value="bote">Bote</option><option value="rollo">Rollo</option><option value="juego">Juego</option></select></div><div class="form-group"><label class="form-label">Stock M\u00ednimo</label><input class="form-input" id="fNPM" type="number" inputmode="numeric" placeholder="0" min="0"></div><div class="form-group"><label class="form-label">Stock Actual</label><input class="form-input" id="fNPS" type="number" inputmode="numeric" placeholder="0" min="0"></div><div class="form-group"><label class="form-label">Proveedor</label><select class="form-select" id="fNPV" onchange="var f=document.getElementById(\'newProvField\');if(f)f.style.display=this.value===\'__new__\'?\'block\':\'none\'"><option value="Sin asignar">Sin asignar</option><option value="Sams">Sams</option><option value="Costco">Costco</option><option value="Pacsa Deli">Pacsa Deli</option><option value="__new__">\uff0b Otro...</option></select></div><div id="newProvField" style="display:none"><div class="form-group"><label class="form-label">Nuevo Proveedor</label><input class="form-input" id="fNPVN" placeholder="Nombre"></div></div><div class="form-group"><label class="form-label">Piezas por paquete</label><input class="form-input" id="fNPPQ" type="number" inputmode="numeric" placeholder="1" min="1" value="1"><div style="font-size:11px;color:var(--text2);margin-top:4px">Si compras paquetes con varias unidades (ej: 6 jabones por paq), pon 6. Si no, d\u00e9jalo en 1.</div></div><button class="btn btn-success" onclick="subNewProd()">\u2705 Agregar</button><div style="height:10px"></div><button class="btn btn-secondary" onclick="closeModal()">\u2716 Cerrar</button>'}
async function subNewProd(){var cat=document.getElementById('fNPC').value;var nc=document.getElementById('fNCN')?.value?.trim()||'';var nm=document.getElementById('fNPN').value.trim();var un=document.getElementById('fNPU').value;var mn=document.getElementById('fNPM').value||'0';var st=document.getElementById('fNPS').value||'0';var prov=document.getElementById('fNPV').value;var ppq=document.getElementById('fNPPQ')?.value||'1';var npv=document.getElementById('fNPVN')?.value?.trim()||'';if(prov==='__new__'){if(!npv){toast('Escribe proveedor',1);return}prov=npv}if(cat==='__new__'){if(!nc){toast('Escribe categor\u00eda',1);return}cat=nc}if(!cat||!nm){toast('Completa campos',1);return}var dup=S.catalogo.find(function(p){return p.producto.toLowerCase()===nm.toLowerCase()});if(dup){toast('Ya existe',1);return}var id=nextId('ALM',S.catalogo);try{await Sheets.append('\u{1F4E6} Cat\u00e1logo',[id,cat,nm,un,parseInt(mn),parseInt(st),'SI',prov,parseInt(ppq)]);await logAction('Producto agregado',nm+' en '+cat,'add');toast(nm+' agregado');document.getElementById('fNPN').value='';document.getElementById('fNPM').value='';document.getElementById('fNPS').value='';Sheets.loadAll()}catch(e){toast('Error',1)}}

var _editProd=null;
function openEditProd(id){if(!isAdmin())return;_editProd=S.catalogo.find(function(p){return p.id===id});if(!_editProd)return;modalType='editProduct';render()}
function fmEditProd(){if(!_editProd)return'';var cats=getCats();return'<div class="modal-title">\u270f\ufe0f Editar Producto</div><div class="form-group"><label class="form-label">Categor\u00eda</label><select class="form-select" id="fEPC" onchange="var f=document.getElementById(\'editCatField\');if(f)f.style.display=this.value===\'__new__\'?\'block\':\'none\'"><option value="">Seleccionar...</option>'+cats.map(function(c){return'<option value="'+c+'" '+(_editProd.categoria===c?'selected':'')+'>'+c+'</option>'}).join('')+'<option value="__new__">\uff0b Nueva...</option></select></div><div id="editCatField" style="display:none"><div class="form-group"><label class="form-label">Nueva Categor\u00eda</label><input class="form-input" id="fECN" placeholder="Nombre"></div></div><div class="form-group"><label class="form-label">Producto</label><input class="form-input" id="fEPN" value="'+_editProd.producto+'"></div><div class="form-group"><label class="form-label">Unidad</label><select class="form-select" id="fEPU"><option value="pza" '+(_editProd.unidad==='pza'?'selected':'')+'>Pieza</option><option value="kg" '+(_editProd.unidad==='kg'?'selected':'')+'>Kilogramo</option><option value="lt" '+(_editProd.unidad==='lt'?'selected':'')+'>Litro</option><option value="paq" '+(_editProd.unidad==='paq'?'selected':'')+'>Paquete</option><option value="caja" '+(_editProd.unidad==='caja'?'selected':'')+'>Caja</option><option value="bolsa" '+(_editProd.unidad==='bolsa'?'selected':'')+'>Bolsa</option><option value="bote" '+(_editProd.unidad==='bote'?'selected':'')+'>Bote</option><option value="rollo" '+(_editProd.unidad==='rollo'?'selected':'')+'>Rollo</option><option value="juego" '+(_editProd.unidad==='juego'?'selected':'')+'>Juego</option></select></div><div class="form-group"><label class="form-label">Stock M\u00ednimo</label><input class="form-input" id="fEPM" type="number" value="'+_editProd.stockMinimo+'"></div><div class="form-group"><label class="form-label">Stock Actual</label><input class="form-input" id="fEPS" type="number" value="'+_editProd.stockActual+'"></div><div class="form-group"><label class="form-label">Proveedor</label><select class="form-select" id="fEPV" onchange="var f=document.getElementById(\'editProvField\');if(f)f.style.display=this.value===\'__new__\'?\'block\':\'none\'">'+getProvs().map(function(p){return'<option value="'+p+'" '+(_editProd.proveedor===p?'selected':'')+'>'+p+'</option>'}).join('')+'<option value="__new__">\uff0b Otro...</option></select></div><div id="editProvField" style="display:none"><div class="form-group"><label class="form-label">Nuevo Proveedor</label><input class="form-input" id="fEPVN" placeholder="Nombre"></div></div><div class="form-group"><label class="form-label">Piezas por paquete</label><input class="form-input" id="fEPPQ" type="number" value="'+_editProd.pzaPaq+'"><div style="font-size:11px;color:var(--text2);margin-top:4px">Conversi\u00f3n paquete \u2192 piezas para entradas</div></div><button class="btn btn-primary" onclick="saveEditProd()">\u{1F4BE} Guardar</button><div style="height:10px"></div><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>'}
async function saveEditProd(){if(!_editProd||!isAdmin())return;var cat=document.getElementById('fEPC').value;var nc=document.getElementById('fECN')?.value?.trim()||'';var nm=document.getElementById('fEPN').value.trim();var un=document.getElementById('fEPU').value;var mn=document.getElementById('fEPM').value||'0';var st=document.getElementById('fEPS').value||'0';var prov=document.getElementById('fEPV').value;var ppq=document.getElementById('fEPPQ')?.value||'1';var npv=document.getElementById('fEPVN')?.value?.trim()||'';if(prov==='__new__'){if(!npv){toast('Escribe proveedor',1);return}prov=npv}if(cat==='__new__'){if(!nc){toast('Escribe categor\u00eda',1);return}cat=nc}if(!cat||!nm){toast('Completa campos',1);return}try{await Sheets.deleteRow('\u{1F4E6} Cat\u00e1logo',_editProd._row);await Sheets.append('\u{1F4E6} Cat\u00e1logo',[_editProd.id,cat,nm,un,parseInt(mn),parseInt(st),'SI',prov,parseInt(ppq)]);await logAction('Producto editado',_editProd.producto+' \u2192 '+nm,'edit');toast(nm+' actualizado');_editProd=null;closeModal();Sheets.loadAll()}catch(e){toast('Error',1)}}
function confirmDelProd(prod){if(confirm('\u{1F5D1} Eliminar '+prod+'?')){var p=S.catalogo.find(function(x){return x.producto===prod});if(!p)return;Sheets.deleteRow('\u{1F4E6} Cat\u00e1logo',p._row).then(function(){logAction('Producto eliminado',prod,'delete');toast('Eliminado');Sheets.loadAll()}).catch(function(){toast('Error',1)})}}

// SETTINGS & USER
function fmSettings(){return'<div class="modal-title">\u2699\ufe0f Configuraci\u00f3n</div><div class="form-group"><label class="form-label">Sheet ID</label><input class="form-input" id="sS" value="'+S.sheetId+'"></div><div class="form-group"><label class="form-label">API Key</label><input class="form-input" id="sA" value="'+S.apiKey+'"></div><div class="form-group"><label class="form-label">Script URL</label><input class="form-input" id="sU" value="'+SCRIPT_URL+'"></div><button class="btn btn-primary" onclick="saveSett()">\u{1F4BE} Guardar</button><div style="height:10px"></div><button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>'}
function saveSett(){S.sheetId=document.getElementById('sS').value;S.apiKey=document.getElementById('sA').value;SCRIPT_URL=document.getElementById('sU').value;localStorage.setItem('sheetId_almacen',S.sheetId);localStorage.setItem('apiKey_almacen',S.apiKey);localStorage.setItem('scriptUrl_almacen',SCRIPT_URL);toast('Guardado');closeModal();Sheets.loadAll()}
function fmUser(){return'<div class="modal-title">\u{1F464} Mi Cuenta</div><div style="text-align:center;margin-bottom:20px"><div class="uib-av" style="width:60px;height:60px;font-size:24px;margin:0 auto 10px">'+uInit()+'</div><div style="font-size:16px;font-weight:600">'+uName()+'</div><div style="font-size:12px;color:var(--text2)">@'+(S.currentUser?.usuario||'')+'</div><div style="font-size:12px;color:var(--accent);margin-top:4px">'+(S.currentUser?.rol==='admin'?'\u{1F511} Administrador':S.currentUser?.rol==='encargado'?'\u{1F468}\u200d\u{1F373} Encargado':'\u{1F4E6} Almacenista')+'</div></div><button class="btn btn-secondary" onclick="closeModal()">Cerrar</button><div style="height:10px"></div><button class="btn btn-primary" style="background:var(--red)" onclick="logout()">\u{1F6AA} Cerrar Sesi\u00f3n</button>'}

// INIT
(async function(){if(S.sheetId&&S.apiKey){var su=localStorage.getItem('currentUser_almacen');if(su){try{S.currentUser=JSON.parse(su);S.screen='main';S.connected=true;render();await Sheets.loadUsers();var ok=S.usuarios.find(function(u){return u.usuario===S.currentUser.usuario});if(!ok){toast('Cuenta deshabilitada',1);logout();return}await Sheets.loadAll()}catch(e){S.screen='login';render()}}else{S.screen='login';S.connected=true;await Sheets.loadUsers();render()}}else{render()}})();
</script>
